org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 8.13：把资源与代码放入同一可达性图，裁剪未使用功能关联的资源。
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
# The application ViewBinding merge generates bindings for library layouts. Keep the app R class
# transitive so those generated bindings can resolve dependency layout IDs in clean release builds.
android.nonTransitiveRClass=false
