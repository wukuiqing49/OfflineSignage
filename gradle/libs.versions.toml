[versions]
agp = "8.13.2"
kotlin = "2.3.0"
compileSdk = "36"
targetSdk = "36"
minSdk = "23"
androidx-core = "1.18.0"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-fragment = "1.8.9"
androidx-lifecycle = "2.10.0"
androidx-constraintlayout = "2.2.1"
androidx-recyclerview = "1.4.0"
material = "1.13.0"
wkq-core-base = "v1.3.0"
wkq-core-utils = "v1.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
material = { module = "com.google.android.material:material", version.ref = "material" }
wkq-core-base = { module = "com.github.wukuiqing49:AndroidCoreBase", version.ref = "wkq-core-base" }
wkq-core-utils = { module = "com.github.wukuiqing49:AndroidCoreUtils", version.ref = "wkq-core-utils" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
